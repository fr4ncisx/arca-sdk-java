name: Security Scan

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Restore OWASP Dependency Check Database
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-db5.6-main-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-db5.6-main-${{ runner.os }}-
            dependency-check-db5.6-${{ runner.os }}-

      - name: Check cached database freshness
        id: database-freshness
        shell: bash
        run: python -B scripts/check_security_cache.py "$RUNNER_TEMP/dependency-check-data"

      - name: Run OWASP Dependency Scan
        id: scan
        shell: bash
        run: |
          mvn package dependency-check:aggregate -Psecurity-scan \
            -DskipTests \
            -DdependencyCheckDataDirectory="$RUNNER_TEMP/dependency-check-data" \
            -DdataDirectory="$RUNNER_TEMP/dependency-check-data" \
            -DautoUpdate=false \
            --batch-mode --no-transfer-progress

      - name: Verify database metadata in report
        id: database-metadata
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || hashFiles('target/dependency-check-report.json') != '') }}
        shell: bash
        run: python -B scripts/check_security_cache.py "$RUNNER_TEMP/dependency-check-data" --report target/dependency-check-report.json

      - name: Upload security reports
        if: ${{ !cancelled() && hashFiles('target/dependency-check-report.*', 'target/bom.*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            target/dependency-check-report.*
            target/bom.*
          if-no-files-found: error
